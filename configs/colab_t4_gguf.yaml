name: colab_t4_gguf
seed: 42
model_id: TheBloke/TinyLlama-1.1B-Chat-v1.0-GGUF
prompt: "The future of efficient language model inference is"
max_new_tokens: 16
warmup_runs: 1
measure_runs: 2
n_ctx: 512
results_dir: results/colab_t4_gguf
gguf_repo: TheBloke/TinyLlama-1.1B-Chat-v1.0-GGUF
gguf_file: tinyllama-1.1b-chat-v1.0.Q4_K_M.gguf
# Same TinyLlama 1.1B family as the T4 lite suite. Q4_K_M is ~670 MB.
# Install llama-cpp-python from a prebuilt wheel first (see notebook). Never compile from source.
experiments:
  - type: benchmark
    method: gguf
    backend: llama.cpp
    gguf_file: tinyllama-1.1b-chat-v1.0.Q4_K_M.gguf
    filename: tinyllama-1.1b-chat-v1.0.Q4_K_M.gguf
