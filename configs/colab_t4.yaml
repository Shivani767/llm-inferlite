name: colab_t4
seed: 42
model_id: TinyLlama/TinyLlama-1.1B-Chat-v1.0
draft_model_id: TinyLlama/TinyLlama-1.1B-Chat-v1.0
prompt: "The future of efficient language model inference is"
max_new_tokens: 32
warmup_runs: 1
measure_runs: 3
results_dir: results/colab_t4
gguf_repo: TheBloke/TinyLlama-1.1B-Chat-v1.0-GGUF
gguf_file: tinyllama-1.1b-chat-v1.0.Q4_K_M.gguf
# Provide these only if you have matching pre-quantized checkpoints:
# gptq_model_id: TheBloke/TinyLlama-1.1B-Chat-v1.0-GPTQ
# awq_model_id: TheBloke/TinyLlama-1.1B-Chat-v1.0-AWQ
experiments:
  - type: quantization
    methods:
      - fp16
      - bf16
      - dynamic_int8
      - int8_bnb
      - int4_bnb
      - awq
      - gptq
      - gguf_q4_k_m
      - smooth_quant
      - squeeze_llm
  - type: kv_cache
    context_lengths: [64, 128, 256, 512]
    max_new_tokens: 16
    measure_runs: 2
  - type: speculative
    # Same family/tokenizer required. A smaller draft of a different family is unsupported.
    gammas: [2, 4]
    max_new_tokens: 32
    measure_runs: 2
  - type: batching
    num_requests: 8
    max_batch_size: 4
    max_new_tokens: 12
