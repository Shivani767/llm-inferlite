name: optimizer_macbook
seed: 42
model_id: gpt2
warmup_runs: 1
measure_runs: 2
budget: 4
results_dir: results/optimizer_macbook
# Exhaustive grid is 2×2×2 = 8 wall-clock jobs. InferLite/random use `budget`.
search_space:
  methods: [fp32, fp16]
  context_tokens: [32, 96]
  max_new_tokens: [8, 16]
  batch_sizes: [1]
  skip_unsupported: true
strategies: [grid, random, heuristic, inferlite]
experiments:
  - type: search
