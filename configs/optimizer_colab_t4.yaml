name: optimizer_colab_t4
seed: 42
model_id: TinyLlama/TinyLlama-1.1B-Chat-v1.0
warmup_runs: 1
measure_runs: 1
budget: 3
results_dir: results/optimizer_colab_t4
# 2 methods × 2 contexts = 4 wall-clock jobs. Skip INT8 (measured slow on T4) and GPTQ
# (no checkpoint). Do not install extra multi-GB packages.
search_space:
  methods: [fp16, int4_bnb]
  context_tokens: [32, 64]
  max_new_tokens: [8]
  batch_sizes: [1]
  skip_unsupported: true
strategies: [grid, random, heuristic, inferlite]
experiments:
  - type: search
